name: Validate Awakening Compat Repair

on:
  push:
    branches:
      - awakening-mixin-repair
    paths:
      - 'custom_mods/awakening-compat/**'
      - '.github/workflows/build-awakening-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awakening-compat-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: custom_mods/awakening-compat

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: custom_mods/awakening-compat/*.gradle*

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Inspect packaged Mixin metadata
        shell: bash
        run: |
          set -euxo pipefail
          REPORT='../../validation-awakening-mixin-repair.txt'
          JAR='build/libs/awakening-compat-0.1.0.jar'
          test -f "$JAR"
          {
            echo '=== packaged entries ==='
            jar tf "$JAR" | grep -E 'awakening_compat\.(mixins|refmap)\.json|HeavyCrossbowArrowMixin.class'
            echo
            echo '=== mixins json ==='
            unzip -p "$JAR" awakening_compat.mixins.json
            echo
            echo '=== refmap ==='
            unzip -p "$JAR" awakening_compat.refmap.json
            echo
          } | tee "$REPORT"

      - name: Inspect Heavy Crossbow mixin bytecode
        shell: bash
        run: |
          set -euxo pipefail
          REPORT='../../validation-awakening-mixin-repair.txt'
          JAR='build/libs/awakening-compat-0.1.0.jar'
          {
            echo '=== HeavyCrossbowArrowMixin javap ==='
            javap -v -p -classpath "$JAR" dev.xaulim.awakeningicaruscompat.mixin.HeavyCrossbowArrowMixin \
              | grep -E -A10 -B4 'getAllSupportedProjectiles|getSupportedHeldProjectiles|releaseUsing|RuntimeVisibleAnnotations|RuntimeInvisibleAnnotations'
            echo
          } | tee -a "$REPORT"

      - name: Inspect resolved Spartan Heavy Crossbow signatures
        shell: bash
        run: |
          set -euxo pipefail
          REPORT='../../validation-awakening-mixin-repair.txt'
          SPARTAN=$(find ~/.gradle/caches -type f \( -iname '*spartan*weaponry*.jar' -o -iname '*SpartanWeaponry*.jar' \) | head -n 1)
          test -n "$SPARTAN"
          {
            echo '=== Spartan resolved JAR ==='
            echo "$SPARTAN"
            echo '=== Spartan HeavyCrossbowItem signatures ==='
            javap -p -classpath "$SPARTAN" com.oblivioussp.spartanweaponry.item.HeavyCrossbowItem \
              | grep -E 'getAllSupportedProjectiles|getSupportedHeldProjectiles|getDefaultCreativeAmmo|releaseUsing'
            echo
          } | tee -a "$REPORT"

      - name: Verify Drow glare overlay is packaged
        run: |
          JAR='build/libs/awakening-compat-0.1.0.jar'
          jar tf "$JAR" | grep -q '^dev/xaulim/awakeningcompat/client/DrowSunGlareOverlay.class$'
          echo 'DrowSunGlareOverlay.class: packaged' >> ../../validation-awakening-mixin-repair.txt

      - name: Commit validation report
        working-directory: .
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation-awakening-mixin-repair.txt
          git commit -m 'Record awakening-compat repair validation'
          git push origin HEAD:awakening-mixin-repair
