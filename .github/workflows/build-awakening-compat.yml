name: Validate Awakening Compat Repair

on:
  push:
    branches:
      - awakening-mixin-repair
    paths:
      - 'custom_mods/awakening-compat/**'
      - '.github/workflows/build-awakening-compat.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: awakening-compat-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: custom_mods/awakening-compat/*.gradle*

      - name: Build and record diagnostics
        shell: bash
        run: |
          set -uo pipefail
          REPORT="$GITHUB_WORKSPACE/validation-awakening-mixin-repair.txt"
          MODDIR="$GITHUB_WORKSPACE/custom_mods/awakening-compat"
          JAR="$MODDIR/build/libs/awakening-compat-0.1.0.jar"
          : > "$REPORT"

          {
            echo "commit=$GITHUB_SHA"
            echo "java=$(java -version 2>&1 | head -n 1)"
            echo
            echo '=== gradle build ==='
          } >> "$REPORT"

          cd "$MODDIR"
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon clean build --stacktrace >> "$REPORT" 2>&1
          BUILD_STATUS=$?
          set -e

          echo >> "$REPORT"
          echo "build_status=$BUILD_STATUS" >> "$REPORT"

          if [ "$BUILD_STATUS" -eq 0 ]; then
            {
              echo
              echo '=== packaged entries ==='
              jar tf "$JAR" | grep -E 'awakening_compat\.(mixins|refmap)\.json|HeavyCrossbowArrowMixin.class'
              echo
              echo '=== mixins json ==='
              unzip -p "$JAR" awakening_compat.mixins.json
              echo
              echo '=== refmap ==='
              unzip -p "$JAR" awakening_compat.refmap.json
              echo
              echo '=== HeavyCrossbowArrowMixin javap ==='
              javap -v -p -classpath "$JAR" dev.xaulim.awakeningicaruscompat.mixin.HeavyCrossbowArrowMixin \
                | grep -E -A10 -B4 'getAllSupportedProjectiles|getSupportedHeldProjectiles|releaseUsing|RuntimeVisibleAnnotations|RuntimeInvisibleAnnotations'
              echo
              echo '=== Spartan resolved JAR ==='
            } >> "$REPORT" 2>&1

            SPARTAN=$(find ~/.gradle/caches -type f \( -iname '*spartan*weaponry*.jar' -o -iname '*SpartanWeaponry*.jar' \) | head -n 1 || true)
            echo "$SPARTAN" >> "$REPORT"
            if [ -n "$SPARTAN" ]; then
              {
                echo '=== Spartan HeavyCrossbowItem signatures ==='
                javap -p -classpath "$SPARTAN" com.oblivioussp.spartanweaponry.item.HeavyCrossbowItem \
                  | grep -E 'getAllSupportedProjectiles|getSupportedHeldProjectiles|getDefaultCreativeAmmo|releaseUsing'
              } >> "$REPORT" 2>&1 || true
            fi

            if jar tf "$JAR" | grep -q '^dev/xaulim/awakeningcompat/client/DrowSunGlareOverlay.class$'; then
              echo 'DrowSunGlareOverlay.class: packaged' >> "$REPORT"
            else
              echo 'DrowSunGlareOverlay.class: MISSING' >> "$REPORT"
              BUILD_STATUS=1
            fi
          fi

          cd "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation-awakening-mixin-repair.txt
          git commit -m 'Record awakening-compat repair validation' || true
          git push origin HEAD:awakening-mixin-repair

          exit "$BUILD_STATUS"
