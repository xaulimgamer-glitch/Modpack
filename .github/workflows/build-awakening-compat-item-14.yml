name: Build Awakening Compat item 14

on:
  push:
    branches:
      - build/item-14-vanilla-ranged

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Awakening Compat
        working-directory: custom_mods/awakening-compat
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: awakening-compat-item-14
          path: custom_mods/awakening-compat/build/libs/awakening-compat-0.1.0.jar
          if-no-files-found: error
