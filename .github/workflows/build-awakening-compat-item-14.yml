name: Stage Awakening Compat item 14 artifact

on:
  push:
    branches:
      - build/item-14-vanilla-ranged

permissions:
  actions: read
  contents: write

jobs:
  stage-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download validated artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/item14
          mkdir -p /tmp/item14
          gh run download 34774653064 --repo "$GITHUB_REPOSITORY" --name awakening-compat-item-14 --dir /tmp/item14
          test -f /tmp/item14/awakening-compat-0.1.0.jar
          cp /tmp/item14/awakening-compat-0.1.0.jar mods/awakening-compat-0.1.0.jar
      - name: Stage validated JAR on temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/awakening-compat-0.1.0.jar
          git diff --cached --quiet && exit 1
          git commit -m "build: stage validated item 14 jar [skip ci]"
          git push origin HEAD:build/item-14-vanilla-ranged
