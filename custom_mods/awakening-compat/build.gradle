plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '0.1.0'
group = 'dev.xaulim.awakeningcompat'

base {
    archivesName = 'awakening-compat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

repositories {
    maven {
        url = 'https://www.cursemaven.com'

        content {
            includeGroup 'curse.maven'
        }
    }

    maven {
        url = 'https://code.redspace.io/releases'
    }

    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }

    maven {
        url = 'https://maven.theillusivec4.top/'
    }

    maven {
        url = 'https://maven.kosmx.dev/'
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.22'

    implementation fg.deobf(
            'curse.maven:origins-forge-474438:5314209'
    )

    implementation fg.deobf(
            'io.redspace:irons_spellbooks:1.20.1-3.16.3'
    )

    implementation fg.deobf(
            'io.redspace:irons_lib:1.20.1-2.1.0'
    )

    implementation fg.deobf(
            'software.bernie.geckolib:geckolib-forge-1.20.1:4.8.4'
    )

    implementation fg.deobf(
            'top.theillusivec4.curios:curios-forge:5.14.1+1.20.1'
    )

    runtimeOnly fg.deobf(
            'dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20'
    )
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'MixinConfigs':
                        'awakening_compat.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}