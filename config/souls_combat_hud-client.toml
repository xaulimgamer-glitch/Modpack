		y = -12

#Status Gauge
[status_gauge]
	#Should party members be able to see your status
	hide_status_from_party = false

	#This mostly applies for the player gauge, party gauges will always use the server's preferred source type.
	[status_gauge.client_source_preferences]
		#Ensure ignore stamina source is disabled
		#Allowed Values: AUTO, EPIC_FIGHT, PARCOOL, PARAGLIDER, MINE_AND_SLASH
		client_stamina_source = "AUTO"
		#Ensure ignore mana source is disabled
		#Allowed Values: AUTO, IRONS_SPELLBOOKS, MINE_AND_SLASH
		client_mana_source = "AUTO"
		#Allowed Values: AUTO, THIRST_WAS_RECLAIMED, LEGENDARY_SURVIVAL_OVERHAUL
		client_thirst_source = "AUTO"
		ignore_server_stamina_source = false
		ignore_server_mana_source = false

	#Player Gauge Overlay
	#Customize the status gauge in assets/souls_combat_hud/souls_bars/player_gauge.json
	[status_gauge.player_gauge_overlay]
		#Toggle player gauge overlay
		enabled = false
		status_bars = true
		#Allowed Values: FACE, MODEL
		crest_display_mode = "MODEL"
		crest_team_outline = true
		crest_attributes = true
		#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
		anchor = "TOP_LEFT"
		x = 24
		y = 24
		#Range: 0.25 ~ 4.0
		scale = 1.0

	#Party Gauge Overlay
	#Shows status gauges for your teammates
	#Customize the status gauge in assets/souls_combat_hud/souls_bars/party_gauge.json
	[status_gauge.party_gauge_overlay]
		#Toggle party gauge overlay
		enabled = true
		status_bars = true
		#Allowed Values: FACE, MODEL
		crest_display_mode = "MODEL"
		crest_team_outline = true
		#Maximum amount of party members to display
		#Range: 0 ~ 16
		max_displayed_party_members = 4
		#Should offline party members be displayed (FTB Teams)
		show_offline_members = true
		#Sort online players first
		sort_online_first = true
		#Gap offset between party member rows
		#Range: 0 ~ 64
		member_row_gap = 4
		#Should status effects push party member rows.
		status_effects_affect_row_layout = true
		#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
		anchor = "TOP_LEFT"
		x = 24
		y = 76
		#Range: 0.25 ~ 4.0
		scale = 0.8125

	#Baseline and projected-max values used to scale HUD bar widths.
	[status_gauge.status_bars]
		#Let servers override local baseline and projected max values
		force_server_values = true
		#Shows current and max value of status bars
		show_value_text = false
		#Should status bar have equal width. Set 0 to disable.
		#Range: 0 ~ 512
		constant_bar_width = 0

		[status_gauge.status_bars.health]
			#Range: > 1
			baseline = 20
			#Range: > 1
			projected_max = 50
			#Range: 0.1 ~ 3.0
			bar_width_curve = 1.0

		[status_gauge.status_bars.stamina]

			[status_gauge.status_bars.stamina.presets]

				[status_gauge.status_bars.stamina.presets.epic_fight]
					#Range: > 1
					baseline = 20
					#Range: > 1
					projected_max = 45
					#Range: 0.1 ~ 3.0
					bar_width_curve = 1.0

				[status_gauge.status_bars.stamina.presets.parcool]
					#Range: > 1
					baseline = 2000
					#Range: > 1
					projected_max = 3000
					#Range: 0.1 ~ 3.0
					bar_width_curve = 1.0

				[status_gauge.status_bars.stamina.presets.paraglider]
					#Range: > 1
					baseline = 1000
					#Range: > 1
					projected_max = 3000
					#Range: 0.1 ~ 3.0
					bar_width_curve = 1.0

				[status_gauge.status_bars.stamina.presets.mine_and_slash]
					#Range: > 1
					baseline = 50
					#Range: > 1
					projected_max = 1040
					#Range: 0.1 ~ 3.0
					bar_width_curve = 0.4

		[status_gauge.status_bars.mana]

			[status_gauge.status_bars.mana.presets]

				[status_gauge.status_bars.mana.presets.irons_spellbooks]
					#Range: > 1
					baseline = 100
					#Range: > 1
					projected_max = 800
					#Range: 0.1 ~ 3.0
					bar_width_curve = 1.0

				[status_gauge.status_bars.mana.presets.mine_and_slash]
					#Range: > 1
					baseline = 50
					#Range: > 1
					projected_max = 1040
					#Range: 0.1 ~ 3.0
					bar_width_curve = 0.4

	#Status Effects
	[status_gauge.status_effects]
		#Max status effect icons shown per gauge, 0 to disable.
		#Range: 0 ~ 64
		max_displayed = 0
		#Order status effect icons are shown in.
		#Allowed Values: NEWEST, OLDEST, HARMFUL, BENEFICIAL
		sort_order = "NEWEST"

#Visibility
[visibility]

	[visibility.minecraft]
		#Hides the vanilla bossbar.
		hide_bossbar = true
		hide_potion_icons = true
		#Item name text shifts when switching off and on creative mode.
		disable_shift_text_on_gamemode = true

		#Vanilla Hotbar settings
		[visibility.minecraft.hotbar]
			hide_offhand_slot = true
			#Hides the More Offhand Slots slots in the hotbar.
			hide_moreoffhandslots = true

			#Hotbar Status Setting
			[visibility.minecraft.hotbar.status]
				hidden = true
				x = 0
				y = -7

				[visibility.minecraft.hotbar.status.health_level]
					hidden = true
					x = 0
					y = 0

				[visibility.minecraft.hotbar.status.food_level]
					hidden = false
					x = 0
					y = 0

				[visibility.minecraft.hotbar.status.armor_level]
					hidden = false
					x = 0
					y = 0

				[visibility.minecraft.hotbar.status.air_level]
					hidden = true
					x = 0
					y = 0

				[visibility.minecraft.hotbar.status.xp_level]
					hidden = true
					x = 0
					y = 0

		#Vanilla Highlight Item Name Settings
		[visibility.minecraft.item_name]
			x = 0
			y = -22

		#Vanilla Action Bar Settings
		[visibility.minecraft.record_overlay]
			x = 0
			y = -20

	[visibility.epicfight]
		hide_stamina_bar = true

	[visibility.thirst]
		#Hide thirst bar for mods that dont have the config option.
		hide_thirst_bar = true

	[visibility.autohud]
		#Should the hotbar remain hidden if you switched items with the equipment binds.
		hotbar_remain_hidden = true

[debug_client]
	#Allow the mod to send output to log. Useful for obtaining skill overlay ids.
	enabled = false

