
#Skill Overlay
[skill_overlay]
	#Toggle whether to use custom skill overlay for Epic Fight.
	enabled = true
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	anchor = "BOTTOM_LEFT"
	x = 12
	y = 120
	#Range: 0.25 ~ 4.0
	scale = 1.0

	[skill_overlay.skill_setting]
		#Show weapon passive skills. Note that it may break epic fight addons that utilizes special skill overlays.
		show_weapon_passive_skill = false
		#Dont use custom skill overlay for certain weapon passive skills.
		show_weapon_passive_skill_blacklist = ["wom:solar_passive", "wom:napoleon_passive"]
		#Show passive skills.
		show_passive_skills = true
		show_passive_skills_blacklist = []
		#Show guard skill.
		show_guard_skill = true
		show_guard_skill_blacklist = []
		#Show identity skill.
		show_identity_skill = true
		show_identity_skill_blacklist = []

	[skill_overlay.icon]
		#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
		anchor = "CENTER_LEFT"
		x = 4
		y = 0
		#Range: 0.25 ~ 4.0
		scale = 1.0

	[skill_overlay.text]
		#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
		anchor = "CENTER_LEFT"
		x = 22
		y = 1
		#Range: 0.25 ~ 4.0
		scale = 1.0

#Equipment Hud
[equipment_hud]
	#Toggle whether to use the custom equipment HUD.
	enabled = true
	#Should cycling items play a sound.
	cycle_sound = true
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	anchor = "BOTTOM_LEFT"
	x = 60
	y = 60
	#Range: 0.25 ~ 4.0
	scale = 1.0

	#Slots
	[equipment_hud.equipment_slots]

		[equipment_hud.equipment_slots.weapon_slot]
			enabled = true
			#Include Combat Preferred Items (Epic Fight)
			include_combat_prefered = true
			#Include items as a weapon
			weapons_whitelist = []
			#Exclude items as a weapon
			weapons_blacklist = []
			x = 28
			y = 0

			#Preview Slots
			[equipment_hud.equipment_slots.weapon_slot.preview_slots]
				#Range: 0 ~ 12
				max_slots = 0
				#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
				anchor = "CENTER_RIGHT"
				#Allowed Values: HORIZONTAL, VERTICAL
				orientation = "VERTICAL"
				x = 0
				y = 0

		[equipment_hud.equipment_slots.offhand_slot]
			enabled = true
			x = -28
			y = 0

			#Preview Slots
			[equipment_hud.equipment_slots.offhand_slot.preview_slots]
				#Range: 0 ~ 12
				max_slots = 0
				#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
				anchor = "CENTER_LEFT"
				#Allowed Values: HORIZONTAL, VERTICAL
				orientation = "VERTICAL"
				x = 0
				y = 0

		[equipment_hud.equipment_slots.consumable_slot]
			enabled = true
			#Should cycling your consumables jump to the item.
			cycle_consumable_switch = false
			#Should the use consumable key work directly if selected hotbar item is a consumable.
			use_consumable_on_selected = false
			#Include items as a consumable
			consumables_whitelist = []
			#Exclude items as a consumable
			consumables_blacklist = []
			#Exclude items that should autoconsume
			autoconsume_blacklist = ["remnantcurios:flask"]
			x = 0
			y = 18

			[equipment_hud.equipment_slots.consumable_slot.item_name]
				enabled = true
				auto_hide = false
				#Range: 0 ~ 20000
				hold_millis = 2000
				#Range: 0 ~ 5000
				fade_millis = 400

			#Preview Slots
			[equipment_hud.equipment_slots.consumable_slot.preview_slots]
				#Range: 0 ~ 12
				max_slots = 3
				#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
				anchor = "BOTTOM_RIGHT"
				#Allowed Values: HORIZONTAL, VERTICAL
				orientation = "HORIZONTAL"
				x = 0
				y = -16

		[equipment_hud.equipment_slots.spell_slot]
			enabled = true
			x = 0
			y = -18

			[equipment_hud.equipment_slots.spell_slot.item_name]
				enabled = true
				auto_hide = false
				#Range: 0 ~ 20000
				hold_millis = 2000
				#Range: 0 ~ 5000
				fade_millis = 400

			#Preview Slots
			[equipment_hud.equipment_slots.spell_slot.preview_slots]
				#Range: 0 ~ 12
				max_slots = 3
				#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
				anchor = "TOP_RIGHT"
				#Allowed Values: HORIZONTAL, VERTICAL
				orientation = "HORIZONTAL"
				x = 0
				y = 16

#Custom Bossbar
[custom_bossbar]
	#Toggle whether to use Souls-like bossbars.
	enabled = true
	#Should the bossbar display the damage value it has taken. This only works if mod is installed on the server.
	reduction_value_text = true
	#Should the bossbar name text allow the text to be colored etc.
	ignore_boss_name_formatting = true
	#Delay in miliseconds before the bossbar disappears
	#This is added on to custom bossbar disappear_delay property
	#Range: 0 ~ 2147483647
	disappear_delay = 0
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	anchor = "BOTTOM_CENTER"
	max_visible = 4
	#Range: 0.25 ~ 4.0
	scale = 1.0
	width = 320
	x = 0
	y = 64

#Oxygen Bar
[oxygen_bar]
	#Toggle oxygen bar
	enabled = true
	#Allowed Values: TOP_LEFT, TOP_CENTER, TOP_RIGHT, CENTER_LEFT, CENTER, CENTER_RIGHT, BOTTOM_LEFT, BOTTOM_CENTER, BOTTOM_RIGHT
	anchor = "BOTTOM_CENTER"
	#Range: 0.25 ~ 4.0
	scale = 1.0
	width = 182
	x = 0
	y = 60

