
#Adds seasonal and humidity rules for crops.
#Snow-covered models for grass, bamboo, and leaves, with autumnal color adjustments for themed biomes.
[es_x_ru]
	#Enable compat package es_x_ru
	Enable = true
	#This package will be loaded first.
	PriorityLoading = false

#Snow-covered models for vertical slabs.
[es_x_quark]
	#Enable compat package es_x_quark
	Enable = true
	#This package will be loaded first.
	PriorityLoading = false

#Adds seasonal and humidity compatibility for abnormal crops.
[es_dp_x_abnormals]
	#Enable compat package es_dp_x_abnormals
	Enable = true
	#This package will be loaded first.
	PriorityLoading = false

